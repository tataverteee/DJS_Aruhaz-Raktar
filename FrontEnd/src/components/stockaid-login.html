<!DOCTYPE html>
<html lang="hu">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StockAid – Bejelentkezés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
    :root{
      --page:#f3f5f8; --navy:#142a3f; --navy-2:#1d374f; --navy-line:#2c4964;
      --orange:#f08a3c; --orange-hover:#ff9a50; --on-orange:#1a1208;
      --field:#ffffff; --field-text:#142a3f; --placeholder:#7d8d9e;
      --label:#a9bacb; --error:#ff8f8f;
      font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]){ --page:#0b1621; --navy:#122639; --navy-line:#294660; }
    }
    :root[data-theme="dark"]{ --page:#0b1621; --navy:#122639; --navy-line:#294660; }
    *,*::before,*::after{box-sizing:inherit}
    html,body{height:100%}
    body{margin:0;background:var(--page);display:grid;place-items:center;padding:16px;font-size:15px;line-height:1.45}
    button,input{font:inherit}
    :focus-visible{outline:3px solid var(--orange);outline-offset:2px}

    .card{
      width:100%;max-width:400px;background:var(--navy);color:#fff;
      border-radius:24px;padding:36px 32px 32px;
    }
    .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px}
    .brand svg{width:48px;height:48px;flex:none}
    .brand-name{display:block;font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1}
    .brand-name b{color:var(--orange);font-weight:600}
    .brand-tag{display:block;font-size:9px;letter-spacing:.22em;color:var(--label);margin-top:5px;white-space:nowrap}

    h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    form{display:grid;gap:14px}
    .field{display:grid;gap:6px}
    .field label{font-size:13px;color:var(--label);padding-left:2px}
    .control{position:relative}
    .control input{
      width:100%;height:52px;border:2px solid transparent;border-radius:12px;
      background:var(--field);color:var(--field-text);padding:0 16px;font-size:16px;
    }
    .control input::placeholder{color:var(--placeholder)}
    .control input:focus{outline:none;border-color:var(--orange)}
    .control input[aria-invalid="true"]{border-color:var(--error)}
    .control.has-toggle input{padding-right:52px}
    .toggle{
      position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;border-radius:8px;
      background:transparent;color:#5c6f82;cursor:pointer;display:grid;place-items:center;
    }
    .toggle:hover{background:#eef2f6}
    .toggle svg{width:22px;height:22px}
    .error{min-height:20px;margin:0;font-size:13px;color:var(--error);padding-left:2px}
    .error:empty{display:none}

    .submit{
      margin-top:10px;height:54px;border:0;border-radius:12px;background:var(--orange);color:var(--on-orange);
      font-size:18px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;
    }
    .submit:hover{background:var(--orange-hover)}
    .submit:active{transform:translateY(1px)}

    @media (max-width:480px){
      .card{padding:28px 20px 24px;border-radius:22px}
      .brand svg{width:40px;height:40px}
      .brand-name{font-size:26px}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>
  </head>
<body>

<main class="card">
  <div class="brand" role="img" aria-label="StockAid – Warehouse Management">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="23" fill="#1d374f"/>
      <path d="M12 36c-4-3-5-10-2-15 2-4 6-6 9-5-3 3-3 8-1 11 1 3 1 6-1 9z" fill="#f08a3c"/>
      <rect x="20" y="22" width="17" height="14" rx="2" fill="#e9b27a"/>
      <path d="M20 28h17" stroke="#b9783a" stroke-width="2"/>
      <circle cx="26" cy="17" r="5" fill="#f08a3c"/>
    </svg>
    <div>
      <span class="brand-name">Stock<b>Aid</b></span>
      <span class="brand-tag">WAREHOUSE MANAGEMENT</span>
    </div>
  </div>

  <h1>Bejelentkezés</h1>

  <form id="login" novalidate>
    <div class="field">
      <label for="user">Felhasználónév</label>
      <div class="control">
        <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
    </div>

    <div class="field">
      <label for="pass">Jelszó</label>
      <div class="control has-toggle">
        <input id="pass" name="pass" type="password" autocomplete="current-password" required>
        <button class="toggle" type="button" id="toggle" aria-label="Jelszó megjelenítése" aria-pressed="false">
          <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <p class="error" id="error" role="alert"></p>

    <button class="submit" type="submit">Bejelentkezés</button>
  </form>
</main>

<script>
const form = document.getElementById("login");
const user = document.getElementById("user"), pass = document.getElementById("pass");
const error = document.getElementById("error"), toggle = document.getElementById("toggle");

toggle.addEventListener("click", () => {
  const show = pass.type === "password";
  pass.type = show ? "text" : "password";
  toggle.setAttribute("aria-pressed", show);
  toggle.setAttribute("aria-label", show ? "Jelszó elrejtése" : "Jelszó megjelenítése");
});

[user, pass].forEach(i => i.addEventListener("input", () => {
  i.removeAttribute("aria-invalid"); error.textContent = "";
}));

form.addEventListener("submit", e => {
  e.preventDefault();
  const missing = [user, pass].filter(i => !i.value.trim());
  missing.forEach(i => i.setAttribute("aria-invalid", "true"));
  if (missing.length) {
    error.textContent = missing.length === 2
      ? "Add meg a felhasználónevet és a jelszót."
      : missing[0] === user ? "Add meg a felhasználónevet." : "Add meg a jelszót.";
    missing[0].focus();
    return;
  }
  // TODO:  hívd a hitelesítést (API). Sikeres belépés után:
  window.location.href = "stockaid-homescreen.html";
});
</script>
</body>
</html>
